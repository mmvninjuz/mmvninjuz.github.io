<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="ninja-test-page" content="p4-v1">
<title>Ninja web test page p4-v1</title>
<!-- Test page for the Ninja Video web screen (browser parcel 4: volume, full screen, go to a time, replay). The video is the same clip as page p2 (../p2/clip.mp4, same site, no second copy).
     Modes, chosen by ?mode=
     auto   the video plays by itself (the app's own test setting lets it)
     tap    one big Play button covers the page and plays on the tap (a real user gesture)
     fs     as tap; after the Play tap a second big button, "Full screen", covers the page: a real tap on it asks the page's own full-screen view for the video's wrapper
            (the site's own full-screen button). The page writes what it knows into the document: body data-fs = on or off (from fullscreenchange), data-state as in p2
     none   text only, no video at all (a page with nothing to play)
     No timers, no other requests, no tracking. It is not linked from the site. It must not change: the app's phone check reads its title. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: sans-serif; }
  #wrap { background: #000; }
  video { width: 100%; display: block; }
  .big { position: fixed; left: 0; top: 0; width: 100%; height: 100%; box-sizing: border-box; font-size: 44px; background: #1a73e8; color: #fff; border: 0;
         display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; }
  .big[hidden] { display: none; }
  #text { padding: 24px; font-size: 22px; line-height: 1.4; }
  #text[hidden] { display: none; }
</style>
</head>
<body data-state="loading" data-fs="off">
<div id="wrap"><video id="v" src="../p2/clip.mp4" playsinline preload="auto"></video></div>
<button id="play" class="big" hidden>Play</button>
<button id="fs" class="big" hidden>Full screen</button>
<div id="text" hidden>This page has text and no video. Ninja test page p4, mode none.</div>
<script>
(function () {
  var v = document.getElementById('v');
  var wrap = document.getElementById('wrap');
  var mode = (location.search.match(/[?&]mode=([a-z]+)/) || [])[1] || 'auto';
  var state = function (s) { document.body.setAttribute('data-state', s); };
  var fsOn = function () { return !!(document.fullscreenElement || document.webkitFullscreenElement); };
  function fsChanged() {
    var on = fsOn();
    document.body.setAttribute('data-fs', on ? 'on' : 'off');
    state(on ? 'fs-on' : 'fs-off');
    if (mode === 'fs' && playedOnce) document.getElementById('fs').hidden = on;
  }
  var playedOnce = false;
  document.addEventListener('fullscreenchange', fsChanged);
  document.addEventListener('webkitfullscreenchange', fsChanged);
  v.addEventListener('loadedmetadata', function () { state('ready'); });
  v.addEventListener('play', function () { if (!fsOn()) state('playing'); });
  v.addEventListener('pause', function () { if (!fsOn()) state('paused'); });
  v.addEventListener('error', function () { state('error'); });
  function start() {
    var p = v.play();
    if (p && typeof p.catch === 'function') p.catch(function () { state('blocked'); });
  }
  if (mode === 'none') {
    wrap.hidden = true;
    document.getElementById('text').hidden = false;
    state('ready');
  } else if (mode === 'tap' || mode === 'fs') {
    var b = document.getElementById('play');
    b.hidden = false;
    b.addEventListener('click', function () {
      b.hidden = true;
      playedOnce = true;
      start();
      if (mode === 'fs') document.getElementById('fs').hidden = false;
    });
    document.getElementById('fs').addEventListener('click', function () {
      var f = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
      if (f) {
        var r = f.call(wrap);
        if (r && typeof r.catch === 'function') r.catch(function () { state('fs-refused'); });
      } else {
        state('fs-unsupported');
      }
    });
  } else {
    start();
  }
})();
</script>
</body>
</html>
