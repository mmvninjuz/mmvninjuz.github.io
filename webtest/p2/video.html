<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="ninja-test-page" content="p2-v1">
<title>Ninja web test page p2-v1</title>
<!-- Test page for the Ninja Video web screen (browser parcel 2). One video (clip.mp4, next to this file) and one big control, chosen by ?mode=
     auto   the video plays by itself (the app's own test setting lets it)
     tap    one big Play button covers the page and plays on the tap (a real user gesture, the rule the app really has)
     popup  one big button that opens a pop-up window on the tap
     google one big link to the Google sign-in page
     No timers, no other requests, no tracking. It is not linked from the site. It must not change: the app's phone check reads its title and the video's length. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: sans-serif; }
  video { width: 100%; display: block; }
  .big { position: fixed; left: 0; top: 0; width: 100%; height: 100%; box-sizing: border-box; font-size: 44px; background: #1a73e8; color: #fff; border: 0;
         display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; }
  .big[hidden] { display: none; }
</style>
</head>
<body data-state="loading">
<video id="v" src="clip.mp4" playsinline preload="auto"></video>
<button id="play" class="big" hidden>Play</button>
<button id="popup" class="big" hidden>Open pop-up</button>
<a id="google" class="big" href="https://accounts.google.com/" hidden>Sign in with Google</a>
<script>
(function () {
  var v = document.getElementById('v');
  var mode = (location.search.match(/[?&]mode=([a-z]+)/) || [])[1] || 'auto';
  var state = function (s) { document.body.setAttribute('data-state', s); };
  v.addEventListener('loadedmetadata', function () { state('ready'); });
  v.addEventListener('play', function () { state('playing'); });
  v.addEventListener('pause', function () { state('paused'); });
  v.addEventListener('error', function () { state('error'); });
  function start() {
    var p = v.play();
    if (p && typeof p.catch === 'function') p.catch(function () { state('blocked'); });
  }
  if (mode === 'tap') {
    var b = document.getElementById('play');
    b.hidden = false;
    b.addEventListener('click', function () { b.hidden = true; start(); });
  } else if (mode === 'popup') {
    var o = document.getElementById('popup');
    o.hidden = false;
    o.addEventListener('click', function () { window.open('popup-target.html', '_blank'); });
  } else if (mode === 'google') {
    document.getElementById('google').hidden = false;
  } else {
    start();
  }
})();
</script>
</body>
</html>
